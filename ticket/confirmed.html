<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ticket Confirmed · BEYOND Rooftop Latin Party</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0908">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
:root{
  --acc:#ff6b35; --acc-hi:#ff8552;
  --grad:linear-gradient(120deg,var(--acc) 0%,#f5333f 100%);
  --bg:#0d0908; --panel:#141010; --card:#1c1614; --line:#2e2320;
  --ink:#faf7f5; --ink-2:#a89b96; --ink-3:#776a66;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,
         "Noto Sans Thai","Leelawadee UI",Thonburi,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;line-height:1.45;min-height:100svh;
}
.wrap{max-width:26rem;margin:0 auto;padding:2rem 1.25rem 3rem;display:flex;flex-direction:column;align-items:center}
img.logo{width:6rem;margin-bottom:.75rem;opacity:.9}
.event-line{font-size:.75rem;color:var(--ink-3);text-align:center;margin-bottom:2rem}

.pending-note{font-size:1.0625rem;font-weight:600;color:var(--ink-2);text-align:center;margin-top:2.5rem}

.check{
  width:4rem;height:4rem;border-radius:50%;background:var(--grad);
  display:flex;align-items:center;justify-content:center;margin-bottom:1rem;
}
.check svg{width:2rem;height:2rem;color:#fff}
.status{font-size:1.375rem;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:-.01em}
.status-th{font-size:.8125rem;color:var(--ink-3);text-align:center;margin-top:.35rem;margin-bottom:2rem}

.qty-card{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:.875rem;
  padding:1.75rem 1.25rem;text-align:center;
}
.qty-number{font-size:3.5rem;font-weight:800;line-height:1;color:var(--acc)}
.qty-label{font-size:1rem;font-weight:700;text-transform:uppercase;margin-top:.35rem}
.qty-label small{display:block;font-size:.75rem;font-weight:500;color:var(--ink-3);margin-top:.15rem}
.amount{font-size:.8125rem;color:var(--ink-3);margin-top:.75rem}

.email-card{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:.875rem;
  padding:1.25rem;text-align:center;margin-top:.75rem;
}
.email-card p{font-size:.6875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.email-value{font-size:1.25rem;font-weight:700;word-break:break-word;margin-top:.5rem}

.next-btn{
  display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;margin-top:1.75rem;
  background:var(--acc);border-radius:.75rem;padding:1rem;font-weight:700;color:#fff;
  transition:background-color .15s ease;
}
.next-btn:hover{background:var(--acc-hi)}

.error-note{font-size:.9375rem;font-weight:600;text-align:center;margin-top:2.5rem}
.error-note a{color:var(--acc);text-decoration:underline}

#confirmed,#failed{display:flex;flex-direction:column;align-items:center;width:100%}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="../assets/logo-wide.webp" alt="BEYOND">
  <p class="event-line">BEYOND Rooftop Latin Party · Sat, Sep 12 · Octave Rooftop</p>

  <p class="pending-note" id="pending">Confirming payment…<br>
    <span style="font-weight:500">กำลังยืนยันการชำระเงิน</span></p>

  <div id="confirmed" class="hidden">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12.5l5 5 10-10"/>
      </svg>
    </div>
    <div class="status">Payment Confirmed</div>
    <div class="status-th">ยืนยันการชำระเงินแล้ว</div>

    <div class="qty-card">
      <div class="qty-number" id="qty-number">-</div>
      <div class="qty-label" id="qty-label">Tickets</div>
      <div class="amount" id="amount">-</div>
    </div>

    <div class="email-card">
      <p>Email · อีเมล</p>
      <div class="email-value" id="email-value">-</div>
    </div>

    <a class="next-btn" href="index.html">Sell Another Ticket <span aria-hidden="true">→</span></a>
  </div>

  <div id="failed" class="hidden">
    <p class="error-note">Couldn't confirm this order.<br>
      Check email for the ticket, or <a href="index.html">try again</a>.</p>
  </div>
</div>

<script>
(function(){
  'use strict';

  var pendingEl   = document.getElementById('pending');
  var confirmedEl = document.getElementById('confirmed');
  var failedEl    = document.getElementById('failed');
  var sessionId   = new URLSearchParams(window.location.search).get('session_id');

  function fmt(n){ return n.toLocaleString('en-US'); }

  function showConfirmed(data){
    document.getElementById('qty-number').textContent = data.qty;
    document.getElementById('qty-label').innerHTML =
      (data.qty === 1 ? 'Ticket' : 'Tickets') + '<small>' + data.qty + ' บัตร</small>';
    document.getElementById('amount').textContent = '฿' + fmt(data.amount) + ' paid';
    document.getElementById('email-value').textContent = data.email || 'No email on file';
    pendingEl.classList.add('hidden');
    confirmedEl.classList.remove('hidden');
  }

  function showFailed(){
    pendingEl.classList.add('hidden');
    failedEl.classList.remove('hidden');
  }

  if (!sessionId) {
    window.location.href = 'index.html';
  } else {
    fetch('/.netlify/functions/get-order?session_id=' + encodeURIComponent(sessionId))
      .then(function(r){ return r.json(); })
      .then(function(data){ data.paid ? showConfirmed(data) : showFailed(); })
      .catch(showFailed);
  }
})();
</script>
</body>
</html>
